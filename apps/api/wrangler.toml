name = "ordering-system-api"
main = "src/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Local/dev environment. Override per-environment below for production.
[[d1_databases]]
binding = "DB"
database_name = "ordering_system_db"
database_id = "103db9aa-fe73-407e-85b5-1ed5dadbbf5e"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "ordering-system-docs-dev"

[vars]
ENVIRONMENT = "development"

[triggers]
crons = ["*/5 * * * *"]

# -----------------------------------------------------------------------------
# Production environment — deploy with: wrangler deploy --env production
# -----------------------------------------------------------------------------
[env.production]
name = "ordering-system-api-prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ordering_system_db_prod"
database_id = "54740c89-6eb5-4afa-9acf-fa84d8ed65c2"
migrations_dir = "src/db/migrations"

[[env.production.r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "ordering-system-docs-prod"

[env.production.vars]
ENVIRONMENT = "production"
PUBLIC_TENANT_SLUG = "kk"

[env.production.triggers]
crons = ["*/5 * * * *"]

# Secrets (set via `wrangler secret put <NAME>` — never committed):
#   SESSION_SIGNING_SECRET            - signs/verifies session cookies
#   TELEGRAM_SETTINGS_ENCRYPTION_KEY  - encrypts per-account Telegram bot tokens
